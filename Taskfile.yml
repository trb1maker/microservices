# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: ['.env.example']

vars:
  SERVICES:
    - analytics-service
    - notification-service
    - order-service
    - payment-service
    - store-service
  DOCKER_TAG: dev
  COMPOSE_ENV_FILE: .env.example
  GOLANGCI: go tool -modfile=golangci-lint.mod golangci-lint

tasks:
  fmt:
    desc: Форматирование кода
    cmd: "{{.GOLANGCI}} fmt ./..."

  gen:proto:
    desc: Генерация Go-кода из proto-схем
    cmd: bash scripts/generate-proto.sh

  gen:swagger:
    desc: Генерация Swagger для order-service
    cmd: swag init -g cmd/order-service/main.go -o internal/order-service/docs/swagger --parseDependency --parseInternal

  generate:certs:
    desc: Generate dev TLS/mTLS certificates
    cmd: bash scripts/generate-certs.sh

  jwt:mint:
    desc: Mint JWT for user UUID
    requires:
      vars: [USER_ID]
    cmd: go run ./scripts/mint-jwt.go {{.USER_ID}}

  lint:
    desc: Линтинг
    cmd: "{{.GOLANGCI}} run --config .golangci.yaml ./..."

  lint:fix:
    desc: Линтинг с автоисправлением
    cmd: "{{.GOLANGCI}} run --config .golangci.yaml ./... --fix --max-same-issues=0"

  test:unit:
    desc: Юнит-тестирование
    cmd: go test -v -race ./cmd/... ./internal/... ./tests/ui/...

  test:integration:
    desc: Интеграционные тесты по сервисам
    cmd: go test -tags=integration -timeout 10m ./tests/integration/...

  test:e2e:
    desc: Сквозные saga-тесты всех сервисов
    cmd: go test -tags=e2e -timeout 15m ./tests/e2e/...

  build:apps:
    desc: Сборка бинарников сервисов
    cmds:
      - for: { var: SERVICES }
        cmd: go build -o bin/{{.ITEM}} ./cmd/{{.ITEM}}

  build:images:
    desc: Сборка dev-образов сервисов
    deps: [generate:certs]
    cmds:
      - for: { var: SERVICES }
        cmd: docker build -f deploy/docker/{{.ITEM}} -t {{.ITEM}}:{{.DOCKER_TAG}} .

  ci:
    desc: Полный CI pipeline
    cmds:
      - task: lint
      - task: test:unit
      - task: test:integration
      - task: test:e2e
      - task: build:images
        vars:
          DOCKER_TAG: ci
      - bash scripts/smoke-order-service.sh

  demo:up:
    desc: Поднять demo-стек
    deps: [generate:certs]
    cmd: docker compose --env-file {{.COMPOSE_ENV_FILE}} up -d --build

  demo:traffic:
    desc: Нагрузочный demo-сценарий для метрик и алертов
    cmd: bash scripts/demo-traffic.sh

  demo:ui:
    desc: Запуск demo UI локально
    cmds:
      - go build -o bin/ui ./tests/ui
      - go run ./tests/ui
  
  demo:down:
    desc: Остановить demo-стек
    cmds:
      - docker compose --env-file {{.COMPOSE_ENV_FILE}} down -v

  mongo:rs-status:
    desc: Статус MongoDB replica set
    cmd: docker compose --env-file {{.COMPOSE_ENV_FILE}} exec mongodb mongosh --quiet --eval "rs.status().members.forEach(m => print(m.name, m.stateStr))"

  sprint6:failover:
    desc: Сценарии отказоустойчивости БД (Sprint 6)
    cmd: bash scripts/sprint6-failover.sh
