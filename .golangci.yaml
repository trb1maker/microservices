version: "2"

linters:
  default: standard
  enable:
    # errors
    - err113
    - errorlint
    - wrapcheck

    # context & HTTP
    - bodyclose
    - contextcheck
    - noctx
    - fatcontext

    # PostgreSQL
    - rowserrcheck
    - sqlclosecheck

    # observability
    - spancheck
    - promlinter
    - sloglint

    # gRPC / protobuf
    - protogetter

    # domain modeling
    - errname
    - exhaustive
    - iface
    - musttag

    # complexity
    - funlen
    - gocognit
    - goconst
    - mnd

    # quality
    - copyloopvar
    - depguard
    - gocritic
    - gosec
    - misspell
    - modernize
    - nolintlint
    - revive

    # tests
    - testifylint
    - thelper
    - tparallel

  settings:
    depguard:
      rules:
        deprecated:
          files:
            - $all
          deny:
            - pkg: "log$"
              desc: Use log/slog
            - pkg: "math/rand$"
              desc: Use math/rand/v2
        domain:
          files:
            - "internal/*/domain/**/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
        application:
          files:
            - "internal/*/app/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/trb1maker/microservices/internal/*/adapters/**
              desc: application layer must not depend on adapters
            - pkg: github.com/trb1maker/microservices/cmd/**
              desc: application layer must not depend on the composition root
        adapters:
          files:
            - "internal/*/adapters/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/trb1maker/microservices/internal/*/app/**
              desc: adapters layer must not depend on the application layer
            - pkg: github.com/trb1maker/microservices/cmd/**
              desc: adapters layer must not depend on the composition root
        shared:
          files:
            - "internal/platform/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/trb1maker/microservices/internal/analytics-service/**
              desc: shared platform must not depend on services
            - pkg: github.com/trb1maker/microservices/internal/notification-service/**
              desc: shared platform must not depend on services
            - pkg: github.com/trb1maker/microservices/internal/order-service/**
              desc: shared platform must not depend on services
            - pkg: github.com/trb1maker/microservices/internal/payment-service/**
              desc: shared platform must not depend on services
            - pkg: github.com/trb1maker/microservices/internal/store-service/**
              desc: shared platform must not depend on services
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    revive:
      rules:
        - name: package-comments
          disabled: true

  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocognit
      - path: tests/integration/
        linters:
          - goconst
          - mnd
      - path: tests/e2e/
        linters:
          - err113
          - errcheck
          - funlen
          - goconst
          - gosec
          - mnd
          - noctx
          - staticcheck
          - testifylint
          - wrapcheck
      - path: tests/ui/
        linters:
          - err113
          - errcheck
          - funlen
          - goconst
          - gosec
          - mnd
          - noctx
          - staticcheck
          - testifylint
          - wrapcheck
      - path: deploy/observability/
        linters:
          - depguard
          - errcheck
          - gosec
      - path: scripts/
        linters:
          - mnd
      - path: internal/.*/adapters/mongodb/repository\.go
        linters:
          - mnd

formatters:
  enable:
    - gofumpt

run:
  timeout: 5m
  allow-parallel-runners: true
  go: "1.27.0"
  concurrency: 4
