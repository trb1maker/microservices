version: "2"

linters:
  default: standard
  enable:
    # errors
    - err113
    - errorlint
    - wrapcheck

    # context & HTTP
    - bodyclose
    - contextcheck
    - noctx
    - fatcontext

    # PostgreSQL
    - rowserrcheck
    - sqlclosecheck

    # observability
    - spancheck
    - promlinter
    - sloglint

    # gRPC / protobuf
    - protogetter

    # domain modeling
    - errname
    - exhaustive
    - iface
    - musttag

    # complexity
    - funlen
    - gocognit
    - goconst
    - mnd

    # quality
    - copyloopvar
    - depguard
    - gocritic
    - gosec
    - misspell
    - modernize
    - nolintlint
    - revive

    # tests
    - testifylint
    - thelper
    - tparallel

  settings:
    depguard:
      rules:
        modules:
          list-mode: original
          files:
            - $all
          allow:
            - $gostd
            - github.com/trb1maker/microservices
            - github.com/alicebob/miniredis/v2
            - github.com/caarlos0/env/v11
            - github.com/exaring/otelpgx
            - github.com/golang-jwt/jwt/v5
            - github.com/jackc/pgx/v5
            - github.com/minio/minio-go/v7
            - github.com/nats-io/nats.go
            - github.com/pressly/goose/v3
            - github.com/prometheus/client_golang
            - github.com/redis/go-redis/v9
            - github.com/stretchr/testify
            - github.com/swaggo/http-swagger
            - github.com/swaggo/swag
            - github.com/testcontainers/testcontainers-go
            - go.mongodb.org/mongo-driver
            - go.opentelemetry.io
            - golang.org/x/crypto
            - google.golang.org/grpc
            - google.golang.org/protobuf
          deny:
            - pkg: "log$"
              desc: Use log/slog
            - pkg: "math/rand$"
              desc: Use math/rand/v2
        domain:
          list-mode: original
          files:
            - "internal/*/domain/**/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
        application:
          list-mode: original
          files:
            - "internal/*/app/**/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/trb1maker/microservices/internal/analytics-service/domain
            - github.com/trb1maker/microservices/internal/notification-service/domain
            - github.com/trb1maker/microservices/internal/order-service/domain
            - github.com/trb1maker/microservices/internal/payment-service/domain
            - github.com/trb1maker/microservices/internal/store-service/domain
            - github.com/trb1maker/microservices/internal/platform
        adapters:
          list-mode: original
          files:
            - "internal/*/adapters/**/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/trb1maker/microservices/internal
            - github.com/trb1maker/microservices/internal/platform
            - github.com/jackc/pgx/v5
            - github.com/minio/minio-go/v7
            - github.com/nats-io/nats.go
            - github.com/redis/go-redis/v9
            - github.com/swaggo/http-swagger
            - go.mongodb.org/mongo-driver
            - go.opentelemetry.io
            - google.golang.org/grpc
          deny:
            - pkg: github.com/trb1maker/microservices/cmd
              desc: adapters must not depend on the composition root
        shared:
          list-mode: original
          files:
            - "internal/platform/**/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/trb1maker/microservices/internal/platform
            - github.com/golang-jwt/jwt/v5
            - github.com/pressly/goose/v3
            - github.com/jackc/pgx/v5
            - github.com/nats-io/nats.go
            - github.com/prometheus/client_golang
            - github.com/redis/go-redis/v9
            - go.mongodb.org/mongo-driver
            - go.opentelemetry.io
            - golang.org/x/crypto
            - google.golang.org/grpc
            - google.golang.org/protobuf
          deny:
            - pkg: github.com/trb1maker/microservices/internal/analytics-service
              desc: shared platform must not depend on services
            - pkg: github.com/trb1maker/microservices/internal/notification-service
              desc: shared platform must not depend on services
            - pkg: github.com/trb1maker/microservices/internal/order-service
              desc: shared platform must not depend on services
            - pkg: github.com/trb1maker/microservices/internal/payment-service
              desc: shared platform must not depend on services
            - pkg: github.com/trb1maker/microservices/internal/store-service
              desc: shared platform must not depend on services
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    revive:
      rules:
        - name: package-comments
          disabled: true

  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocognit
      - path: tests/integration/
        linters:
          - goconst
          - mnd
      - path: tests/e2e/
        linters:
          - err113
          - errcheck
          - funlen
          - goconst
          - gosec
          - mnd
          - noctx
          - staticcheck
          - testifylint
          - wrapcheck
      - path: tests/ui/
        linters:
          - err113
          - errcheck
          - funlen
          - goconst
          - gosec
          - mnd
          - noctx
          - staticcheck
          - testifylint
          - wrapcheck
      - path: deploy/observability/
        linters:
          - depguard
          - errcheck
          - gosec
      - path: scripts/
        linters:
          - mnd
      - path: internal/.*/adapters/mongodb/repository\.go
        linters:
          - mnd

formatters:
  enable:
    - gofumpt

run:
  timeout: 5m
  allow-parallel-runners: true
  go: "1.27.0"
  concurrency: 4
