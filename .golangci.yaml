version: "2"

linters:
  default: standard
  enable:
    # errors
    - err113
    - errorlint
    - wrapcheck

    # context & HTTP
    - bodyclose
    - contextcheck
    - noctx
    - fatcontext

    # PostgreSQL
    - rowserrcheck
    - sqlclosecheck

    # observability
    - spancheck
    - promlinter
    - sloglint

    # gRPC / protobuf
    - protogetter

    # domain modeling
    - errname
    - exhaustive
    - iface
    - musttag

    # complexity
    - funlen
    - gocognit
    - goconst
    - mnd

    # quality
    - copyloopvar
    - depguard
    - gocritic
    - gosec
    - misspell
    - modernize
    - nolintlint
    - revive

    # tests
    - testifylint
    - thelper
    - tparallel

  settings:
    depguard:
      rules:
        deprecated:
          files:
            - $all
          deny:
            - pkg: "log$"
              desc: Use log/slog
            - pkg: "math/rand$"
              desc: Use math/rand/v2
        domain:
          files:
            - "**/internal/domain/**/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/google/uuid
        application:
          files:
            - "**/internal/app/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/trb1maker/microservices/services/*/internal/adapters/**
              desc: application layer must not depend on adapters
            - pkg: github.com/trb1maker/microservices/services/*/cmd/**
              desc: application layer must not depend on the composition root
        adapters:
          files:
            - "**/internal/adapters/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/trb1maker/microservices/services/*/internal/app/**
              desc: adapters layer must not depend on the application layer
            - pkg: github.com/trb1maker/microservices/services/*/cmd/**
              desc: adapters layer must not depend on the composition root
        shared:
          files:
            - "pkg/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/trb1maker/microservices/services/**
              desc: shared pkg must not depend on services
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    revive:
      rules:
        - name: package-comments
          disabled: true

  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocognit
      - path: internal/integration/
        linters:
          - goconst
          - mnd
      - path: internal/adapters/mongodb/repository\.go
        linters:
          - mnd

formatters:
  enable:
    - gofumpt

run:
  timeout: 5m
  allow-parallel-runners: true
  go: "1.26.4"
  concurrency: 4
