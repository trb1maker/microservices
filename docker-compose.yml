services:
  mongodb:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb-2:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongodb_2_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb-3:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27019:27017"
    volumes:
      - mongodb_3_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-2:
        condition: service_healthy
      mongodb-3:
        condition: service_healthy
    volumes:
      - ./deploy/mongodb/init-replica-set.sh:/init-replica-set.sh:ro
    entrypoint: ["/bin/sh", "/init-replica-set.sh"]
    restart: "no"

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - hot_standby=on
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - ./deploy/postgres/init-replication.sh:/docker-entrypoint-initdb.d/02-init-replication.sh:ro
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PRIMARY_HOST: postgres
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT pg_is_in_recovery()" | grep -q t']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.14-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command:
      - -js
      - -sd=/data
      - -m=8222
      - --tls
      - --tlscert=/certs/nats/server.crt
      - --tlskey=/certs/nats/server.key
      - --tlscacert=/certs/ca/ca.crt
      - --tlsverify
    volumes:
      - ./deploy/certs:/certs:ro
      - nats-js:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: .
      dockerfile: deploy/docker/order-service
    ports:
      - "8080:8080"
      - "50052:50052"
    environment:
      HTTP_ADDR: ${HTTP_ADDR}
      GRPC_ADDR: ":50052"
      PAYMENT_GRPC_ADDR: ${PAYMENT_GRPC_ADDR:-payment-service:50051}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      NATS_URL: ${NATS_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED}
      METRICS_PATH: ${METRICS_PATH}
      ACTIVE_ORDERS_REFRESH_SEC: ${ACTIVE_ORDERS_REFRESH_SEC}
      ORDER_CREATED_SUBJECT: ${ORDER_CREATED_SUBJECT:-orders.created}
      RESERVE_ITEMS_SUBJECT: ${RESERVE_ITEMS_SUBJECT:-cart.reserve_items}
      CONFIRM_ORDER_SUBJECT: ${CONFIRM_ORDER_SUBJECT:-orders.confirm}
      RELEASE_RESERVATION_SUBJECT: ${RELEASE_RESERVATION_SUBJECT:-cart.release_reservation}
      ORDER_FINALIZED_SUBJECT: ${ORDER_FINALIZED_SUBJECT:-orders.finalized}
      ORDER_CANCELLED_SUBJECT: ${ORDER_CANCELLED_SUBJECT:-orders.cancelled}
      ITEMS_RESERVED_SUBJECT: ${ITEMS_RESERVED_SUBJECT:-store.items_reserved}
      RESERVATION_FAILED_SUBJECT: ${RESERVATION_FAILED_SUBJECT:-store.reservation_failed}
      ORDER_CONFIRMED_SUBJECT: ${ORDER_CONFIRMED_SUBJECT:-store.order_confirmed}
      STORE_HEALTH_URL: ${STORE_HEALTH_URL:-http://store-service:9092/ready}
      PAYMENT_HEALTH_URL: ${PAYMENT_HEALTH_URL:-http://payment-service:9091/ready}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-minimum-32-characters-long}
      JWT_TTL: ${JWT_TTL:-24h}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/certs/server.crt}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/certs/server.key}
      TLS_CLIENT_CA_FILE: ${TLS_CLIENT_CA_FILE:-/certs/ca.crt}
      NATS_TLS_CERT_FILE: ${NATS_TLS_CERT_FILE:-/certs/client.crt}
      NATS_TLS_KEY_FILE: ${NATS_TLS_KEY_FILE:-/certs/client.key}
      NATS_TLS_CA_FILE: ${NATS_TLS_CA_FILE:-/certs/ca.crt}
      MTLS_SERVICE_CNS: ${MTLS_SERVICE_CNS:-order-service,payment-service}
      CART_TTL: ${CART_TTL:-24h}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      payment-service:
        condition: service_started
      jaeger:
        condition: service_started
    labels:
      logging: promtail
      service: order-service

  payment-service:
    build:
      context: .
      dockerfile: deploy/docker/payment-service
    ports:
      - "50051:50051"
      - "9091:9091"
    environment:
      GRPC_ADDR: ":50051"
      METRICS_ADDR: ${PAYMENT_METRICS_ADDR:-:9091}
      DATABASE_URL: ${PAYMENT_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      OTEL_SERVICE_NAME: ${PAYMENT_OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED}
      METRICS_PATH: ${METRICS_PATH}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT}
      PAYMENT_SUCCEEDED_SUBJECT: ${PAYMENT_SUCCEEDED_SUBJECT}
      PAYMENT_FAILED_SUBJECT: ${PAYMENT_FAILED_SUBJECT}
      REFUND_SUCCEEDED_SUBJECT: ${REFUND_SUCCEEDED_SUBJECT}
      REFUND_FAILED_SUBJECT: ${REFUND_FAILED_SUBJECT}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/certs/server.crt}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/certs/server.key}
      TLS_CLIENT_CA_FILE: ${TLS_CLIENT_CA_FILE:-/certs/ca.crt}
      NATS_TLS_CERT_FILE: ${NATS_TLS_CERT_FILE:-/certs/client.crt}
      NATS_TLS_KEY_FILE: ${NATS_TLS_KEY_FILE:-/certs/client.key}
      NATS_TLS_CA_FILE: ${NATS_TLS_CA_FILE:-/certs/ca.crt}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: promtail
      service: payment-service

  store-service:
    build:
      context: .
      dockerfile: deploy/docker/store-service
    ports:
      - "9092:9092"
    environment:
      NATS_URL: ${NATS_URL}
      METRICS_ADDR: ${STORE_METRICS_ADDR:-:9092}
      MONGODB_URI: ${STORE_MONGODB_URI}
      MONGODB_DB_NAME: ${STORE_MONGODB_DB_NAME}
      REDIS_ADDR: ${REDIS_ADDR}
      STOCK_LOCK_TTL: ${STOCK_LOCK_TTL:-5s}
      STOCK_LOCK_RETRY_COUNT: ${STOCK_LOCK_RETRY_COUNT:-20}
      STOCK_LOCK_RETRY_DELAY: ${STOCK_LOCK_RETRY_DELAY:-50ms}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      OTEL_SERVICE_NAME: ${STORE_OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED}
      RESERVE_ITEMS_SUBJECT: ${RESERVE_ITEMS_SUBJECT}
      CONFIRM_ORDER_SUBJECT: ${CONFIRM_ORDER_SUBJECT}
      RELEASE_RESERVATION_SUBJECT: ${RELEASE_RESERVATION_SUBJECT}
      ITEMS_RESERVED_SUBJECT: ${ITEMS_RESERVED_SUBJECT}
      RESERVATION_FAILED_SUBJECT: ${RESERVATION_FAILED_SUBJECT}
      ORDER_CONFIRMED_SUBJECT: ${ORDER_CONFIRMED_SUBJECT}
      RESERVATION_RELEASED_SUBJECT: ${RESERVATION_RELEASED_SUBJECT}
      NATS_TLS_CERT_FILE: ${NATS_TLS_CERT_FILE:-/certs/client.crt}
      NATS_TLS_KEY_FILE: ${NATS_TLS_KEY_FILE:-/certs/client.key}
      NATS_TLS_CA_FILE: ${NATS_TLS_CA_FILE:-/certs/ca.crt}
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: promtail
      service: store-service

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-receipts}
    volumes:
      - ./deploy/minio/init-bucket.sh:/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init-bucket.sh"]

  notification-service:
    build:
      context: .
      dockerfile: deploy/docker/notification-service
    ports:
      - "9095:9093"
    environment:
      NATS_URL: ${NATS_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      OTEL_SERVICE_NAME: ${NOTIFICATION_OTEL_SERVICE_NAME:-notification-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED}
      METRICS_PATH: ${METRICS_PATH}
      METRICS_ADDR: ${NOTIFICATION_METRICS_ADDR:-:9093}
      ORDER_FINALIZED_SUBJECT: ${ORDER_FINALIZED_SUBJECT:-orders.finalized}
      ORDER_CANCELLED_SUBJECT: ${ORDER_CANCELLED_SUBJECT:-orders.cancelled}
      PAYMENT_SUCCEEDED_SUBJECT: ${PAYMENT_SUCCEEDED_SUBJECT:-payment.succeeded}
      REFUND_SUCCEEDED_SUBJECT: ${REFUND_SUCCEEDED_SUBJECT:-payment.refund_succeeded}
      NATS_TLS_CERT_FILE: ${NATS_TLS_CERT_FILE:-/certs/client.crt}
      NATS_TLS_KEY_FILE: ${NATS_TLS_KEY_FILE:-/certs/client.key}
      NATS_TLS_CA_FILE: ${NATS_TLS_CA_FILE:-/certs/ca.crt}
    depends_on:
      nats:
        condition: service_healthy
      jaeger:
        condition: service_started
    labels:
      logging: promtail
      service: notification-service

  analytics-service:
    build:
      context: .
      dockerfile: deploy/docker/analytics-service
    ports:
      - "8084:8084"
      - "9094:9094"
    environment:
      NATS_URL: ${NATS_URL}
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL:-postgres://orders:orders@postgres:5432/analytics?sslmode=disable}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      OTEL_SERVICE_NAME: ${ANALYTICS_OTEL_SERVICE_NAME:-analytics-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED}
      METRICS_PATH: ${METRICS_PATH}
      METRICS_ADDR: ${ANALYTICS_METRICS_ADDR:-:9094}
      HTTP_ADDR: ${ANALYTICS_HTTP_ADDR:-:8084}
      JWT_SECRET: ${JWT_SECRET}
      RECEIPT_URL_TTL: ${RECEIPT_URL_TTL:-15m}
      ORDER_FINALIZED_SUBJECT: ${ORDER_FINALIZED_SUBJECT:-orders.finalized}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-receipts}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      NATS_TLS_CERT_FILE: ${NATS_TLS_CERT_FILE:-/certs/client.crt}
      NATS_TLS_KEY_FILE: ${NATS_TLS_KEY_FILE:-/certs/client.key}
      NATS_TLS_CA_FILE: ${NATS_TLS_CA_FILE:-/certs/ca.crt}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    labels:
      logging: promtail
      service: analytics-service

  loki:
    image: grafana/loki:3.4.2
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro

  promtail:
    image: grafana/promtail:3.4.2
    volumes:
      - ./deploy/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts:/etc/prometheus/alerts:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    depends_on:
      - order-service
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  webhook-receiver:
    build:
      context: .
      dockerfile: deploy/observability/webhook-receiver/Dockerfile
    ports:
      - "5001:5001"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: ${COLLECTOR_OTLP_ENABLED}

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GF_AUTH_ANONYMOUS_ORG_ROLE}
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME}
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.17.3
    command:
      - -connz
      - -routez
      - -subz
      - -varz
      - -prefix=nats
      - -use_internal_server_id
      - -jsz=all
      - http://nats:8222
    ports:
      - "7777:7777"
    depends_on:
      nats:
        condition: service_healthy

volumes:
  minio-data:
  mongodb_data:
  mongodb_2_data:
  mongodb_3_data:
  nats-js:
  postgres_data:
  postgres_replica_data:
